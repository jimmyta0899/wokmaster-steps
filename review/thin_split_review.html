s are soft and flavorful. Plate and serve.", "dur": 11, "ph": "cook", "tag": "heat", "img": 0}]}, {"slug": "hunan-fermented-black-bean-pork", "name": "豆豉辣椒炒肉", "cuisine": "hunan", "role": "main", "total": 15, "video": true, "n": 4, "steps": [{"n": 1, "zh": "五花肉去皮，切成约0.3厘米厚的薄片。青辣椒洗净去蒂，切成滚刀块。大蒜3瓣切成薄片", "en": "Remove the skin from the pork belly and slice it thinly, about 0.3 cm thick. Wash green peppers, remove stems, and cut into irregular chunks.", "dur": 1, "ph": "prep", "tag": "knife", "img": 1}, {"n": 2, "zh": "豆豉用清水稍微冲一下，泡1分钟后捞出沥干，这样可以去除部分盐分，也更容易出香。", "en": "Slice 3 cloves of garlic into thin pieces. Briefly rinse fermented black beans with water, soak for 1 minute, then drain. This helps remove some saltiness and brings out the aroma.", "dur": 0, "ph": "prep", "tag": "knife", "img": 0}, {"n": 3, "zh": "锅中倒少许油，下入五花肉片，中小火慢慢煸炒，炒至肉片出油、边缘微卷、呈金黄色；加入蒜片和泡好的豆豉，翻炒出浓郁的豉香味", "en": "Add a little oil to a pan. Add the pork belly slices and stir-fry over medium-low heat slowly until the fat renders, the edges curl, and they turn golden. Add garlic slices and the soaked fermented black beans, stir-frying until fragrant.", "dur": 7, "ph": "cook", "tag": "heat", "img": 1}, {"n": 4, "zh": "下入青辣椒块，转大火快速翻炒，炒至辣椒表面微微起皱、辣味释放；淋入生抽1勺和少许老抽上色，根据咸度决定是否加少许盐，翻炒均匀即可出锅。", "en": "Add the green pepper chunks, increase heat to high, and stir-fry quickly until the pepper skin wrinkles and the spice releases. Drizzle with 1 spoonful of light soy sauce and a little dark soy sauce for color. Add a little salt if needed, toss to combine, and serve.", "dur": 7, "ph": "cook", "tag": "heat", "img": 0}]}, {"slug": "hunan-stir-fried-youxian-dried-tofu-pork", "name": "攸县香干炒肉", "cuisine": "hunan", "role": "main", "total": 25, "video": true, "n": 4, "steps": [{"n": 1, "zh": "香干切条", "en": "Cut dried tofu (xiang gan) into strips;", "dur": 7, "ph": "prep", "tag": "knife", "img": 1}, {"n": 2, "zh": "五花肉切片。", "en": "slice pork belly.", "dur": 10, "ph": "prep", "tag": "knife", "img": 0}, {"n": 3, "zh": "五花肉煸出油，下蒜片炒香；下香干煎至微黄，下青椒翻炒。", "en": "Stir-fry pork belly until fat renders. Add garlic slices and stir-fry until fragrant.", "dur": 5, "ph": "cook", "tag": "heat", "img": 1}, {"n": 4, "zh": "（香干煎过更香）；加生抽盐炒匀出锅。", "en": "Add dried tofu and pan-fry until slightly yellow, then add green peppers and stir-fry. (Pan-frying the tofu enhances its flavor.) Add light soy sauce and salt, stir well, and serve.", "dur": 3, "ph": "cook", "tag": "heat", "img": 0}]}, {"slug": "lotus-root-starch-porridge", "name": "藕粉", "cuisine": "home_style", "role": "dessert", "total": 5, "video": true, "n": 3, "steps": [{"n": 1, "zh": "藕粉加少量凉开水搅成均匀无颗粒的浆", "en": "Mix lotus root starch with a small amount of cool boiled water to form a smooth, lump-free slurry.", "dur": 2, "ph": "prep", "tag": "", "img": 1}, {"n": 2, "zh": "一次性冲入刚烧开的沸水，边冲边搅", "en": "Pour boiling water all at once while stirring continuously until it becomes a transparent, thick paste.", "dur": 2, "ph": "cook", "tag": "heat", "img": 0}, {"n": 3, "zh": "搅到呈透明稠糊状，加糖即可。", "en": "Add sugar to taste.", "dur": 1, "ph": "plate", "tag": "", "img": 0}]}, {"slug": "lotus-seed-lily-bulb-congee", "name": "莲子百合粥", "cuisine": "home_style", "role": "breakfast", "total": 50, "video": true, "n": 3, "steps": [{"n": 1, "zh": "莲子、百合提前泡20分钟。", "en": "Soak the lotus seeds and lily bulbs in advance for 20 minutes.", "dur": 20, "ph": "prep", "tag": "timing", "img": 1}, {"n": 2, "zh": "大米、莲子下锅煮30分钟", "en": "Add the rice and lotus seeds to the pot and cook for 30 minutes;", "dur": 11, "ph": "cook", "tag": "heat", "img": 1}, {"n": 3, "zh": "加百合再煮15分钟到软糯；加冰糖煮化即可。", "en": "add the lily bulbs and cook for another 15 minutes until soft and glutinous; add rock sugar and cook until dissolved.", "dur": 19, "ph": "cook", "tag": "heat", "img": 0}]}, {"slug": "pineapple-bun-with-butter", "name": "菠萝油", "cuisine": "home_style", "role": "breakfast", "total": 5, "video": true, "n": 3, "steps": [{"n": 1, "zh": "菠萝包复烤到热乎酥香。", "en": "Toast the pineapple bun until it is warm and crisp.", "dur": 1, "ph": "cook", "tag": "heat", "img": 1}, {"n": 2, "zh": "横向剖开（不切断）", "en": "Slice horizontally through the bun (do not cut all the way through);", "dur": 1, "ph": "cook", "tag": "knife", "img": 1}, {"n": 3, "zh": "夹入一片刚从冰箱取出的厚黄油，趁热吃。", "en": "insert a thick slice of butter freshly taken from the refrigerator and eat while hot.", "dur": 3, "ph": "plate", "tag": "", "img": 0}]}, {"slug": "salty-soy-milk", "name": "咸豆浆", "cuisine": "home_style", "role": "beverage", "total": 10, "video": true, "n": 4, "steps": [{"n": 1, "zh": "黄豆60g提前泡发", "en": "Soak 60g of soybeans in advance.", "dur": 4, "ph": "prep", "tag": "timing", "img": 1}, {"n": 2, "zh": "加水打成生豆浆并煮熟透。", "en": "Add water and blend to make raw soy milk, then cook thoroughly until fully boiled.", "dur": 5, "ph": "cook", "tag": "heat", "img": 0}, {"n": 3, "zh": "碗里放紫菜、虾皮、榨菜末、生抽和香醋", "en": "In a bowl, place seaweed, dried shrimp, minced pickled mustard tuber, soy sauce, and Chinese black vinegar. Pour the boiling soy milk into the bowl from a height;", "dur": 0, "ph": "cook", "tag": "", "img": 1}, {"n": 4, "zh": "滚热的豆浆高高冲入碗中，豆浆遇酸会凝成絮状；掰半根油条泡进去，趁热喝。", "en": "the acid will cause the soy milk to curdle into fluffy bits. Break half a youtiao into the bowl and drink hot.", "dur": 1, "ph": "rest", "tag": "knife", "img": 0}]}, {"slug": "savory-nut-oil-porridge", "name": "油茶面", "cuisine": "home_style", "role": "staple", "total": 10, "video": true, "n": 4, "steps": [{"n": 1, "zh": "面粉干锅小火炒到微黄出香，加油炒匀。", "en": "Roast the flour in a dry pan over low heat until slightly yellow and fragrant, then add oil and stir to combine.", "dur": 2, "ph": "cook", "tag": "heat", "img": 1}, {"n": 2, "zh": "（炒面全程小火，勤翻别炒糊）；加芝麻、花生碎炒香关火。", "en": "(Keep the heat low throughout roasting and stir frequently to prevent burning.) Add sesame seeds and crushed peanuts, stir until fragrant, then turn off the heat.", "dur": 4, "ph": "cook", "tag": "heat", "img": 0}, {"n": 3, "zh": "取几勺炒面，用沸水冲成稠糊", "en": "Take a few spoonfuls of the roasted flour,", "dur": 3, "ph": "cook", "tag": "heat", "img": 1}, {"n": 4, "zh": "加糖拌着吃。", "en": "pour boiling water over it to form a thick paste, mix with sugar, and eat.", "dur": 1, "ph": "plate", "tag": "", "img": 0}]}, {"slug": "sizzling-plate-noodles", "name": "铁板面", "cuisine": "home_style", "role": "breakfast", "total": 15, "video": true, "n": 3, "steps": [{"n": 1, "zh": "面条煮到八分熟沥干。", "en": "Boil noodles until al dente, then drain.", "dur": 12, "ph": "cook", "tag": "heat", "img": 1}, {"n": 2, "zh": "铁板或平底锅加热，煎蛋、煎火腿和蘑菇", "en": "Heat a griddle or frying pan. Fry eggs, ham, and mushrooms.", "dur": 2, "ph": "cook", "tag": "heat", "img": 1}, {"n": 3, "zh": "放面条淋黑胡椒酱翻拌，配煎蛋。", "en": "Add the noodles, drizzle with black pepper sauce, and toss to combine. Serve with the fried eggs.", "dur": 1, "ph": "cook", "tag": "heat", "img": 0}]}, {"slug": "spicy-young-chicken-with-green-pepper", "name": "青椒童子鸡", "cuisine": "sichuan", "role": "main", "total": 25, "video": true, "n": 4, "steps": [{"n": 1, "zh": "童子鸡斩小块，加料酒生抽腌15分钟", "en": "Cut the young chicken into small pieces. Add cooking wine and light soy sauce, then marinate for 15 minutes.", "dur": 8, "ph": "prep", "tag": "knife", "img": 1}, {"n": 2, "zh": "青椒切块，小米辣切圈，姜蒜切片。", "en": "Cut green peppers into chunks, slice millet peppers into rings, and slice ginger and garlic.", "dur": 7, "ph": "prep", "tag": "knife", "img": 0}, {"n": 3, "zh": "热油下鸡块中火煸炒至表皮微黄、水分收干；下花椒姜蒜爆香，淋料酒", "en": "Heat oil in a pan and stir-fry the chicken pieces over medium heat until the skin is slightly yellow and moisture has evaporated. Add Sichuan peppercorns, ginger, and garlic and stir until fragrant, then drizzle in cooking wine.", "dur": 2, "ph": "cook", "tag": "heat", "img": 1}, {"n": 4, "zh": "下青椒小米辣，大火翻炒3分钟；加生抽调味炒匀出锅。", "en": "Add green peppers and millet peppers, and stir-fry over high heat for 3 minutes. Add light soy sauce to season, stir well, and serve.", "dur": 1, "ph": "cook", "tag": "heat", "img": 0}]}, {"slug": "steamed-leavened-cake", "name": "发糕", "cuisine": "home_style", "role": "breakfast", "total": 90, "video": true, "n": 4, "steps": [{"n": 1, "zh": "面粉200g加酵母3g、白糖40g、温水约160ml，搅成稠面糊", "en": "Mix 200g of flour with 3g of yeast, 40g of white sugar, and about 160ml of warm water to form a thick batter.", "dur": 38, "ph": "prep", "tag": "", "img": 1}, {"n": 2, "zh": "面糊盖保鲜膜醒发1小时，发至两倍大。", "en": "Cover with plastic wrap and let it rest (proof) for 1 hour until doubled in size.", "dur": 22, "ph": "prep", "tag": "timing", "img": 0}, {"n": 3, "zh": "倒入刷了油的蒸碗，表面摆几颗红枣。（蒸的时候中途别开盖）", "en": "Pour the batter into a steaming bowl brushed with oil, and arrange a few red dates on top.", "dur": 14, "ph": "cook", "tag": "heat", "img": 1}, {"n": 4, "zh": "水开后上锅大火蒸25分钟，关火焖5分钟再开盖。", "en": "(Do not open the lid midway through steaming.) Once the water is boiling, place the bowl in the steamer and steam on high heat for 25 minutes. Turn off the heat and let it rest for 5 minutes before opening the lid.", "dur": 11, "ph": "cook", "tag": "heat", "img": 0}]}, {"slug": "stir-fried-lotus-root", "name": "清炒莲藕片", "cuisine": "hubei", "role": "main", "total": 9, "video": true, "n": 4, "steps": [{"n": 1, "zh": "莲藕去皮切薄片，泡在加了白醋的清水里防氧化", "en": "Peel lotus root and slice thinly. Soak in water with white vinegar to prevent oxidation.", "dur": 5, "ph": "prep", "tag": "knife", "img": 1}, {"n": 2, "zh": "青椒切菱形片，大蒜切末。", "en": "Cut green pepper into diamond shapes. Mince garlic.", "dur": 3, "ph": "prep", "tag": "knife", "img": 0}, {"n": 3, "zh": "热锅下油，蒜末炒香后藕片大火炒1分钟", "en": "Heat oil in a wok, stir-fry minced garlic until fragrant, then add lotus root slices and stir-fry on high heat for 1 minute.", "dur": 1, "ph": "cook", "tag": "heat", "img": 1}, {"n": 4, "zh": "下青椒，加盐和白醋炒匀出锅。", "en": "Add green pepper, salt, and white vinegar, stir well, and remove from heat.", "dur": 0, "ph": "cook", "tag": "heat", "img": 0}]}, {"slug": "stir-fried-okra-with-eggs", "name": "秋葵炒蛋", "cuisine": "cantonese", "role": "main", "total": 15, "video": true, "n": 3, "steps": [{"n": 1, "zh": "秋葵焯水1分钟捞出切段。（秋葵焯水去黏液更清爽）", "en": "Blanch the okra for 1 minute, then remove and cut into segments. (Blanching removes slime for a cleaner texture.)", "dur": 1, "ph": "cook", "tag": "heat", "img": 1}, {"n": 2, "zh": "鸡蛋打散炒至凝固盛出；爆香蒜片，下秋葵炒1分钟", "en": "Scramble the beaten eggs until set, then remove. Stir-fry garlic slices until fragrant, add okra and stir-fry for 1 minute.", "dur": 1, "ph": "cook", "tag": "heat", "img": 1}, {"n": 3, "zh": "倒回鸡蛋加盐炒匀出锅。", "en": "Return the eggs to the pan, add salt, stir-fry to combine, and serve.", "dur": 0, "ph": "cook", "tag": "heat", "img": 0}]}, {"slug": "stir-fried-pork-garlic-scapes", "name": "蒜薹炒肉", "cuisine": "shandong", "role": "main", "total": 12, "video": true, "n": 3, "steps": [{"n": 1, "zh": "蒜薹掐去老根切段，沸水焯40秒；五花肉切薄片", "en": "Trim the tough ends from the garlic scapes and cut them into segments. Blanch in boiling water for 40 seconds. Slice the pork belly thinly.", "dur": 1, "ph": "cook", "tag": "heat", "img": 1}, {"n": 2, "zh": "热锅下五花肉片，中火煸出油至微黄；下蒜薹大火炒1分半。", "en": "Heat a pan, add the pork belly slices, and stir-fry over medium heat until the fat renders and the meat turns slightly golden. Add the garlic scapes and stir-fry over high heat for 1.5 minutes.", "dur": 1, "ph": "cook", "tag": "heat", "img": 0}, {"n": 3, "zh": "加生抽和盐炒匀出锅。", "en": "Add light soy sauce and salt, stir-fry until well combined, and serve.", "dur": 10, "ph": "cook", "tag": "heat", "img": 1}]}, {"slug": "stir-fried-pork-with-green-pepper", "name": "青椒炒肉", "cuisine": "sichuan", "role": "main", "total": 20, "video": true, "n": 4, "steps": [{"n": 1, "zh": "里脊切丝，加料酒、生抽、淀粉抓匀腌10分钟", "en": "Cut the tenderloin into shreds. Add cooking wine, soy sauce, and cornstarch.", "dur": 8, "ph": "prep", "tag": "knife", "img": 1}, {"n": 2, "zh": "青椒切丝。", "en": "Mix well and marinate for 10 minutes. Cut the green peppers into shreds.", "dur": 2, "ph": "prep", "tag": "knife", "img": 0}, {"n": 3, "zh": "热锅冷油下肉丝，中火滑炒至变色盛出；锅底油爆香蒜片，下青椒丝大火炒至断生微软。", "en": "Heat the wok with cold oil, add the meat shreds, and stir-fry over medium heat until they change color. Remove and set aside. In the remaining oil, stir-fry garlic slices until fragrant, then add the green pepper shreds.", "dur": 6, "ph": "cook", "tag": "heat", "img": 1}, {"n": 4, "zh": "（青椒要大火快炒才脆）；倒回肉丝，加盐和少许生抽翻炒均匀出锅。", "en": "Stir-fry over high heat until just cooked but still crisp. (High heat and quick stir-frying keep the peppers crunchy.) Return the meat to the wok, add salt and a little soy sauce, stir-fry to combine, and serve.", "dur": 4, "ph": "cook", "tag": "heat", "img": 0}]}, {"slug": "stir-fried-river-shrimp-chives", "name": "韭菜炒河虾", "cuisine": "hunan", "role": "main", "total": 15, "video": true, "n": 4, "steps": [{"n": 1, "zh": "河虾剪须先洗净沥干", "en": "Trim the whiskers of river shrimp, wash, and drain thoroughly.", "dur": 9, "ph": "prep", "tag": "knife", "img": 1}, {"n": 2, "zh": "韭菜切段。", "en": "Cut leeks into sections.", "dur": 5, "ph": "prep", "tag": "knife", "img": 0}, {"n": 3, "zh": "热锅下油爆香姜片，下河虾大火炒至变色", "en": "Heat oil in a pan and sauté ginger slices until fragrant. Add river shrimp and stir-fry over high heat until the color changes.", "dur": 0, "ph": "cook", "tag": "heat", "img": 1}, {"n": 4, "zh": "烹料酒，下韭菜段大火翻炒30秒；加盐炒匀立即出锅。", "en": "Splash in cooking wine, add leek sections, and stir-fry on high heat for 30 seconds. Add salt, mix well, and remove from heat immediately.", "dur": 1, "ph": "cook", "tag": "heat", "img": 0}]}, {"slug": "stir-fried-smoked-tofu-celery", "name": "香干炒芹菜", "cuisine": "hunan", "role": "main", "total": 15, "video": true, "n": 4, "steps": [{"n": 1, "zh": "香干切条", "en": "Cut the smoked tofu into strips", "dur": 6, "ph": "prep", "tag": "knife", "img": 1}, {"n": 2, "zh": "芹菜切段。", "en": "and the celery into segments.", "dur": 7, "ph": "prep", "tag": "knife", "img": 0}, {"n": 3, "zh": "热锅下油爆香蒜片；下香干煎至微黄，下芹菜大火翻炒2分钟", "en": "Heat the pan with oil and sauté garlic slices until fragrant.", "dur": 1, "ph": "cook", "tag": "heat", "img": 1}, {"n": 4, "zh": "加生抽、盐炒匀出锅。", "en": "Pan-fry the smoked tofu until slightly golden, add the celery, and stir-fry over high heat for 2 minutes. Add light soy sauce and salt, mix well, and serve.", "dur": 1, "ph": "cook", "tag": "heat", "img": 0}]}, {"slug": "stir-fried-soybean-sprouts", "name": "素炒黄豆芽", "cuisine": "shandong", "role": "main", "total": 8, "video": true, "n": 4, "steps": [{"n": 1, "zh": "黄豆芽掐去根须洗净; 青椒切丝", "en": "Trim roots and wash soybean sprouts. Julienne green peppers.", "dur": 0, "ph": "prep", "tag": "knife", "img": 1}, {"n": 2, "zh": "沸水焯1分钟去掉豆腥味, 捞出沥干。", "en": "Blanch in boiling water for 1 minute to remove bean odor, then remove and drain.", "dur": 1, "ph": "cook", "tag": "heat", "img": 0}, {"n": 3, "zh": "热锅下油, 蒜末炒香后下豆芽大火炒1分钟", "en": "Heat oil in a pan and fry minced garlic until fragrant. Add soybean sprouts and stir-fry on high heat for 1 minute.", "dur": 1, "ph": "cook", "tag": "heat", "img": 1}, {"n": 4, "zh": "下青椒丝, 加盐和香醋炒匀出锅。", "en": "Add green pepper strips, salt, and fragrant vinegar, mix well, and serve.", "dur": 0, "ph": "cook", "tag": "heat", "img": 0}]}, {"slug": "stir-fried-spinach", "name": "清炒菠菜", "cuisine": "cantonese", "role": "main", "total": 6, "video": true, "n": 4, "steps": [{"n": 1, "zh": "菠菜去根洗净切两段", "en": "Remove roots from spinach, wash, and cut into two sections.", "dur": 0, "ph": "prep", "tag": "knife", "img": 1}, {"n": 2, "zh": "沸水焯10秒过凉沥干（去草酸）。", "en": "Blanch in boiling water for 10 seconds, cool in water, and drain well (to remove oxalic acid).", "dur": 1, "ph": "cook", "tag": "heat", "img": 0}, {"n": 3, "zh": "热锅下油，蒜末炒香", "en": "Heat oil in a wok, stir-fry minced garlic until fragrant.", "dur": 0, "ph": "cook", "tag": "heat", "img": 1}, {"n": 4, "zh": "下菠菜大火快炒20秒；加盐炒匀出锅。", "en": "Add spinach and stir-fry quickly on high heat for 20 seconds. Add salt, stir well, and remove from heat.", "dur": 1, "ph": "cook", "tag": "heat", "img": 0}]}, {"slug": "sweet-soy-milk", "name": "甜豆浆", "cuisine": "home_style", "role": "beverage", "total": 5, "video": true, "n": 3, "steps": [{"n": 1, "zh": "黄豆60g泡发后打成豆浆并煮熟。", "en": "Soak 60g of soybeans, blend them into soy milk, and boil it thoroughly.", "dur": 4, "ph": "cook", "tag": "heat", "img": 1}, {"n": 2, "zh": "滤去豆渣，加白糖10g搅匀", "en": "Strain out the soy pulp, add 10g of white sugar,", "dur": 1, "ph": "plate", "tag": "", "img": 1}, {"n": 3, "zh": "趁热饮用。", "en": "and stir until dissolved. Serve hot.", "dur": 0, "ph": "plate", "tag": "", "img": 0}]}, {"slug": "taiwanese-egg-pancake", "name": "台湾蛋饼", "cuisine": "taiwanese", "role": "breakfast", "total": 15, "video": true, "n": 3, "steps": [{"n": 1, "zh": "鸡蛋加葱花打散。", "en": "Beat eggs with chopped scallions.", "dur": 10, "ph": "prep", "tag": "", "img": 1}, {"n": 2, "zh": "平底锅少油倒入蛋液，盖上一张蛋饼皮", "en": "Heat a small amount of oil in a non-stick pan. Pour in the egg mixture, place an egg crepe skin on top.", "dur": 2, "ph": "plate", "tag": "", "img": 1}, {"n": 3, "zh": "蛋液凝固后翻面煎着，卷起切段，淋酱油膏。（皮要软嫩，别煎脆）", "en": "Once the egg sets, flip and fry briefly. Roll up, cut into segments, and drizzle with savory sauce. (Ensure the skin remains tender, not crispy.)", "dur": 3, "ph": "cook", "tag": "heat", "img": 0}]}, {"slug": "teochew-rice-noodle-soup", "name": "潮汕粿汁", "cuisine": "cantonese", "role": "staple", "total": 30, "video": true, "n": 3, "steps": [{"n": 1, "zh": "卤水煮一锅卤肉、猪肠、豆干、卤蛋", "en": "In a pot of braising liquid, braise pork meat, pork intestines, tofu squares, and braised eggs.", "dur": 10, "ph": "cook", "tag": "heat", "img": 1}, {"n": 2, "zh": "另锅水开下粿汁片煮到软滑", "en": "In a separate pot, boil water and cook guozhi noodles until soft and smooth.", "dur": 8, "ph": "cook", "tag": "heat", "img": 0}, {"n": 3, "zh": "粿汁装碗浇卤汤,铺切好的卤味和烫生菜。", "en": "Place the guozhi noodles in a bowl, pour the braising broth over them, and top with the sliced braised meats and blanched lettuce.", "dur": 12, "ph": "cook", "tag": "heat", "img": 0}]}, {"slug": "tiger-skin-green-peppers", "name": "虎皮青椒", "cuisine": "sichuan", "role": "main", "total": 20, "video": true, "n": 4, "steps": [{"n": 1, "zh": "青椒去蒂洗净擦干，热锅无油下锅压扁煎。", "en": "Remove stems from green peppers, wash, and dry thoroughly. Place peppers in a hot, dry pan and press flat to pan-fry without oil.", "dur": 5, "ph": "cook", "tag": "heat", "img": 1}, {"n": 2, "zh": "(干锅煎虎皮，椒盖不油)；煎至两面起虎皮斑，盛出。", "en": "This creates a tiger-skin texture without greasiness. Fry until both sides have blistered tiger-skin spots, then remove.", "dur": 7, "ph": "cook", "tag": "heat", "img": 0}, {"n": 3, "zh": "爆香蒜末豆豉，倒回青椒", "en": "Stir-fry minced garlic and black beans until fragrant. Return the peppers to the pan.", "dur": 3, "ph": "cook", "tag": "heat", "img": 1}, {"n": 4, "zh": "淋生抽、醋、糖调的汁，翻炒裹匀出锅。", "en": "Pour in a sauce made of soy sauce, vinegar, and sugar, toss to coat evenly, and serve.", "dur": 5, "ph": "cook", "tag": "heat", "img": 0}]}, {"slug": "vietnamese-baguette-sandwich", "name": "越式法包", "cuisine": "home_style", "role": "breakfast", "total": 20, "video": true, "n": 4, "steps": [{"n": 1, "zh": "法棍剖开烤脆", "en": "Split the baguette, toast until crisp,", "dur": 4, "ph": "cook", "tag": "heat", "img": 1}, {"n": 2, "zh": "内抹猪肝酱。", "en": "and spread liver pâté inside.", "dur": 3, "ph": "cook", "tag": "seasoning", "img": 0}, {"n": 3, "zh": "夹入肉片、酸甜腌萝卜、黄瓜条", "en": "Layer with sliced meat, sweet and sour pickled radish, and cucumber strips;", "dur": 6, "ph": "rest", "tag": "timing", "img": 1}, {"n": 4, "zh": "加香菜、辣椒，挤少许Maggi汁。", "en": "add cilantro and chili, then squeeze on a little Maggi sauce.", "dur": 7, "ph": "rest", "tag": "", "img": 0}]}, {"slug": "wife-cake", "name": "老婆饼", "cuisine": "home_style", "role": "dessert", "total": 90, "video": true, "n": 3, "steps": [{"n": 1, "zh": "水油皮和油酥分别和好，叠擀两次起酥", "en": "Knead the water-oil dough and oil dough separately, fold and roll twice to create layers.", "dur": 7, "ph": "prep", "tag": "", "img": 1}, {"n": 2, "zh": "包入冬瓜蓉馅压扁，划两刀刷蛋黄撒芝麻。", "en": "Wrap in winter melon paste filling, flatten, make two slits, brush with egg yolk, and sprinkle with sesame seeds.", "dur": 8, "ph": "plate", "tag": "seasoning", "img": 0}, {"n": 3, "zh": "190度烤20分钟。（划口防止烤时爆开）", "en": "Bake at 190°C for 20 minutes. (Slits help prevent bursting during baking.)", "dur": 20, "ph": "cook", "tag": "heat", "img": 1}]}, {"slug": "wood-ear-mushrooms-cabbage", "name": "木耳炒白菜", "cuisine": "shandong", "role": "main", "total": 10, "video": true, "n": 4, "steps": [{"n": 1, "zh": "白菜帮斜刀切片、叶子切段", "en": "Slice the Napa cabbage stems diagonally and cut the leaves into sections.", "dur": 4, "ph": "prep", "tag": "knife", "img": 1}, {"n": 2, "zh": "木耳泡发撕小朵；蒜切片。", "en": "Soak wood ear mushrooms until soft and tear into small pieces. Slice garlic.", "dur": 4, "ph": "prep", "tag": "knife", "img": 0}, {"n": 3, "zh": "油热下蒜片爆香，下白菜帮炒1分钟", "en": "Heat oil, add garlic slices, and stir-fry until fragrant. Add the Napa cabbage stems and stir-fry for 1 minute.", "dur": 1, "ph": "cook", "tag": "heat", "img": 1}, {"n": 4, "zh": "下木耳和白菜叶，大火翻炒2分钟；加生抽盐调味炒匀即可。", "en": "Add the wood ear mushrooms and Napa cabbage leaves, and stir-fry on high heat for 2 minutes. Season with light soy sauce and salt, stir well, and serve.", "dur": 1, "ph": "cook", "tag": "heat", "img": 0}]}, {"slug": "wood-ear-mushrooms-yam", "name": "木耳炒山药", "cuisine": "shandong", "role": "main", "total": 50, "video": true, "n": 4, "steps": [{"n": 1, "zh": "山药去皮切薄片，泡在加了白醋的清水里防发黑", "en": "Peel the yam and slice into thin pieces; soak in water with a little white vinegar to prevent browning. Soak wood ear mushrooms until soft, then tear into small bite-sized pieces.", "dur": 9, "ph": "prep", "tag": "knife", "img": 1}, {"n": 2, "zh": "木耳泡发撕小朵；沸水把山药和木耳各焯20秒沥干。", "en": "Blanch the yam slices and wood ear mushrooms separately in boiling water for 20 seconds each, then drain.", "dur": 11, "ph": "cook", "tag": "heat", "img": 0}, {"n": 3, "zh": "热锅下油，蒜末炒香，先下胡萝卜片炒30秒", "en": "Heat oil in a wok, stir-fry minced garlic until fragrant. Add carrot slices and stir-fry for 30 seconds.", "dur": 15, "ph": "cook", "tag": "heat", "img": 1}, {"n": 4, "zh": "下山药和木耳大火炒1分钟，加盐炒匀出锅。", "en": "Add the yam and wood ear mushrooms, stir-fry on high heat for 1 minute, season with salt, stir to combine, and remove from heat.", "dur": 15, "ph": "cook", "tag": "heat", "img": 0}]}, {"slug": "xianghe-meat-pie", "name": "香河肉饼", "cuisine": "home_style", "role": "breakfast", "total": 60, "video": true, "n": 4, "steps": [{"n": 1, "zh": "温水和软面醒30分钟，肉末加葱姜、生抽、香油打水拌馅", "en": "Prepare a soft dough with warm water and let it rest for 30 minutes. Mix minced meat with green onion, ginger, light soy sauce, and sesame oil, adding water while stirring to create the filling.", "dur": 17, "ph": "prep", "tag": "timing", "img": 1}, {"n": 2, "zh": "大面皮包大量肉馅，像包包子一样收口按扁。", "en": "Wrap a large amount of filling in the large dough skin, sealing it like a baozi and then flattening it.", "dur": 13, "ph": "prep", "tag": "", "img": 0}, {"n": 3, "zh": "平底锅小火盖盖烙", "en": "Pan-fry over low heat with the lid on until both", "dur": 7, "ph": "cook", "tag": "heat", "img": 1}, {"n": 4, "zh": "两面金黄、内馅熟透。", "en": "sides are golden brown and the filling is fully cooked.", "dur": 8, "ph": "cook", "tag": "", "img": 0}]}, {"slug": "xiangxi-grandma-pickled-veg", "name": "湘西外婆菜", "cuisine": "hunan", "role": "main", "total": 31, "video": true, "n": 4, "steps": [{"n": 1, "zh": "萝卜干50g、干豆角30g、梅干菜30g分别用温水泡发30分钟，泡软后捞出沥干，切成细末", "en": "Soak 50g dried radish, 30g dried bean curd sticks, and 30g preserved mustard greens in warm water for 30 minutes until soft.", "dur": 20, "ph": "prep", "tag": "knife", "img": 1}, {"n": 2, "zh": "青红辣椒切成小丁，大蒜3瓣切末，生姜切末备用。", "en": "Drain and squeeze out excess water, then finely mince each. Dice green and red chilies, mince 3 cloves of garlic, and mince ginger. Set aside.", "dur": 10, "ph": "prep", "tag": "knife", "img": 0}, {"n": 3, "zh": "锅中倒少许油，下入五花肉末，中小火慢慢煸炒至肉末出油、颜色金黄；加入姜蒜末炒香，再放入青红辣椒丁翻炒1分钟", "en": "Heat a small amount of oil in a wok. Add minced pork belly and stir-fry over medium-low heat until the fat renders and the meat turns golden. Add the minced ginger and garlic, stir until fragrant, then add the diced green and red chilies and stir-fry for 1 minute.", "dur": 0, "ph": "cook", "tag": "heat", "img": 1}, {"n": 4, "zh": "倒入泡好切细的三种腌菜末，转大火快速翻炒均匀，炒出腌菜的香味；淋入生抽1勺，撒入少许白糖提鲜，翻炒均匀后出锅即可。", "en": "Add the finely chopped three preserved vegetables, increase heat to high, and stir-fry quickly to distribute evenly and release the pickled aroma. Drizzle in 1 tablespoon soy sauce and sprinkle a little white sugar to enhance flavor. Stir-fry until well combined, then remove from heat.", "dur": 1, "ph": "cook", "tag": "heat", "img": 0}]}, {"slug": "you-tiao", "name": "油条", "cuisine": "home_style", "role": "breakfast", "total": 63, "video": true, "n": 4, "steps": [{"n": 1, "zh": "面粉加酵母小苏打打盐和鸡蛋和面，醒发1小时", "en": "Mix flour with yeast, baking soda, salt, and eggs to form a dough; let rest for 1 hour.", "dur": 32, "ph": "prep", "tag": "timing", "img": 1}, {"n": 2, "zh": "面团擀长条切段，两段叠压用筷子压痕。", "en": "Roll the dough into a long strip, cut into segments, stack two pieces on top of each other, and press a dent in the center with a chopstick.", "dur": 28, "ph": "prep", "tag": "knife", "img": 0}, {"n": 3, "zh": "油温六成热，拉长下锅炸。", "en": "When the oil is at 60% heat, stretch the dough and lower it into the pot.", "dur": 1, "ph": "cook", "tag": "heat", "img": 1}, {"n": 4, "zh": "（油温要够，油条才膨胀）；翻面炸至金黄捞出控油。", "en": "(Ensure the oil temperature is high enough for the dough to expand.) Flip and fry until golden brown, then remove and drain.", "dur": 2, "ph": "cook", "tag": "heat", "img": 0}]}], "dist": [[3, 13], [4, 31]], "noZh": 0, "noEn": 0, "recipes": 44, "steps": 163, "lt3": 0};
const esc = s => (s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
document.getElementById('kpis').innerHTML = [
  [M.recipes, '道菜'],
  [M.steps, '步（原 84 步）'],
  [M.lt3, '步数仍 <3', M.lt3 > 0],
  [M.noZh, '空中文步', M.noZh > 0],
  [M.noEn, '空英文步', M.noEn > 0],
  [M.dist.map(d => d[0] + '步×' + d[1]).join(' / '), '步数分布'],
].map(([v, l, w]) => `<div class="kpi${w ? ' warn' : ''}"><b>${v}</b><span>${l}</span></div>`).join('');

const TAGN = {cook:'加热', prep:'备料', plate:'装盘', rest:'等待', assemble:'组合',
  heat:'火候', knife:'刀工', seasoning:'调味', timing:'时间'};
let filter = 'all';
const list = document.getElementById('list');

function render() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  list.innerHTML = M.cards.filter(c => {
    if (filter === 'n3' && c.n !== 3) return false;
    if (filter === 'n4' && c.n !== 4) return false;
    if (filter === 'img' && !c.steps.some(s => !s.img)) return false;
    if (!q) return true;
    return c.slug.includes(q) || c.name.toLowerCase().includes(q) ||
      c.steps.some(s => (s.zh + s.en).toLowerCase().includes(q));
  }).map(c => {
    const pill = c.n < 3 ? 'n2' : 'n3p';
    return `<div class="card" data-slug="${c.slug}">
      <div class="chead"><span class="nm">${esc(c.name)}</span>
        <span class="pill ${pill}">${c.n} 步</span>
        <span class="slug">${c.slug}</span>
        <span class="pill">${c.cuisine||'-'} · ${c.role||'-'} · ${c.total}min</span></div>
      <div class="meta">${c.video ? '有视频' : '无视频'} · ${c.steps.filter(s=>s.img).length}/${c.n} 步有图</div>
      <div class="body">${c.steps.map(s => `<div class="step">
        <div class="no">${s.n}</div>
        <div><div class="zh">${esc(s.zh) || '<i style="color:#c00">（中文为空）</i>'}</div>
          <div class="en">${esc(s.en) || '<i style="color:#c00">（英文为空）</i>'}</div>
          <div class="tags">${s.dur ? `<span class="t">${s.dur} min</span>` : ''}
            ${s.ph ? `<span class="t ${s.ph}">${TAGN[s.ph]||s.ph}</span>` : ''}
            ${s.tag ? `<span class="t ${s.tag}">${TAGN[s.tag]||s.tag}</span>` : ''}
            ${s.img ? '<span class="t img">有图</span>' : ''}</div></div></div>`).join('')}
      </div></div>`;
  }).join('') || '<div style="padding:30px;color:#888">没有匹配项</div>';
}
document.getElementById('q').addEventListener('input', render);
document.querySelectorAll('[data-f]').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('[data-f]').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); filter = b.dataset.f; render();
}));
render();
</script></body></html>
