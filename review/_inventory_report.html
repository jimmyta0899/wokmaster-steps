<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wokmaster 菜谱五维盘点</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:#f4f5f7;color:#1c1e21}
.wrap{max-width:1440px;margin:0 auto;padding:28px 20px 80px}
h1{font-size:22px;font-weight:700;letter-spacing:-.2px}
.sub{color:#6b7280;font-size:13px;margin-top:6px}
h2{font-size:15px;font-weight:700;margin:34px 0 14px;display:flex;align-items:center;gap:8px}
h2::before{content:"";width:3px;height:15px;background:#c0392b;border-radius:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:16px 18px}
.card .lbl{font-size:12px;color:#6b7280;letter-spacing:.3px}
.card .big{font-size:30px;font-weight:700;margin:6px 0 2px;letter-spacing:-.5px}
.card .hint{font-size:12px;color:#9ca3af}
.bar{height:6px;background:#eef0f3;border-radius:3px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;border-radius:3px}
.g{background:#16a34a}.y{background:#d97706}.r{background:#c0392b}.b{background:#2563eb}.k{background:#6b7280}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #e5e7eb;border-radius:10px;overflow:hidden}
th,td{padding:9px 12px;text-align:left;font-size:13px;border-bottom:1px solid #f0f1f3;white-space:nowrap}
td:first-child{white-space:normal;min-width:210px}
th{background:#fafbfc;font-weight:600;color:#374151;font-size:12px;letter-spacing:.2px;white-space:nowrap}
tbody tr:hover{background:#fafbfc}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.pill.g{background:#dcfce7;color:#15803d}
.pill.y{background:#fef3c7;color:#a16207}
.pill.r{background:#fee2e2;color:#b91c1c}
.pill.b{background:#dbeafe;color:#1d4ed8}
.pill.k{background:#f3f4f6;color:#4b5563}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:14px 16px;margin-bottom:14px}
select,input[type=text]{font:inherit;font-size:13px;padding:6px 10px;border:1px solid #d8dbe0;border-radius:7px;background:#fff;color:#1c1e21;outline:none}
select:focus,input:focus{border-color:#c0392b}
input[type=text]{min-width:220px}
button{font:inherit;font-size:13px;padding:6px 14px;border:1px solid #d8dbe0;border-radius:7px;background:#fff;cursor:pointer;color:#374151}
button:hover{background:#f6f7f9}
button.pri{background:#c0392b;color:#fff;border-color:#c0392b}
button.pri:hover{background:#a93226}
.cnt{font-size:12px;color:#6b7280;margin-left:auto}
.tblbox{max-height:72vh;overflow:auto;border-radius:10px}
.tblbox table{border-radius:0}
.tblbox thead th{position:sticky;top:0;z-index:2;box-shadow:inset 0 -1px 0 #e5e7eb}
.num{text-align:right;font-variant-numeric:tabular-nums}
.warn{color:#c0392b;font-weight:700}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:#4b5563}
.matrix td:first-child{font-weight:600}
.note{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:14px 18px;font-size:13px;color:#78350f;margin-top:10px}
.note b{color:#78350f}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.two{grid-template-columns:1fr}}
.mini{font-size:12px;color:#6b7280;margin-top:8px}
</style>
</head>

<div class="wrap">
  <h1>Wokmaster 菜谱五维盘点</h1>

    <select id="f-tag"><option value="">全部动作分类</option></select>
    <select id="f-cuisine"><option value="">全部菜系</option></select>

    <span class="cnt" id="cnt"></span>
  </div>
  <div class="tblbox">
    <table>
      <thead><tr>
        <th>菜名</th><th>slug</th><th>来源</th><th>批次</th><th>菜系</th>
        <th class="num">步骤</th><th>步骤图</th><th>视频</th>
        <th class="num">时长(分)</th><th>时长可信度</th><th>动作分类</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

/* ---------- 工具 ---------- */
const pct = (a,b) => b ? (100*a/b) : 0;
const fmt = n => n===null||n===undefined ? '—' : n;
const TONE = {'A':'g','B':'y','C':'r','D':'k'};
function tone(b){ return TONE[(b||'').charAt(0)] || 'k'; }
function pill(text, cls){ return '<span class="pill '+cls+'">'+text+'</span>'; }

document.getElementById('total').textContent = DATA.length;
document.getElementById('gen').textContent = new Date().toLocaleString('zh-CN');

/* ---------- 卡片 ---------- */
const N = DATA.length;

DATA.forEach(d => srcCnt[d.source] = (srcCnt[d.source]||0)+1);

const vidFake = DATA.filter(d=>d.video_bucket.startsWith('B')).length;

const imgNone = DATA.filter(d=>d.img_bucket.startsWith('D')).length;
const timeGood = DATA.filter(d=>d.time_bucket.startsWith('A')).length;
const tagDone = DATA.filter(d=>d.tag_bucket.startsWith('A')).length;
const tagNone = DATA.filter(d=>d.tag_bucket.startsWith('B')).length;
const totSteps = DATA.reduce((a,d)=>a+d.steps,0);
const totImg = DATA.reduce((a,d)=>a+d.steps_with_img,0);
const thin = DATA.filter(d=>d.thin_steps).length;

const cards = [
  {lbl:'有效视频', big:vidOk, hint:vidOk+' / '+N+' · 占 '+pct(vidOk,N).toFixed(1)+'%', v:pct(vidOk,N), tone:'r'},
  {lbl:'步骤图全覆盖', big:imgFull, hint:AWK(), v:pct(imgFull,N), tone:'g'},
  {lbl:'时长齐全且可信', big:timeGood, hint:timeGood+' / '+N+' · 步骤时长来自真实来源', v:pct(timeGood,N), tone:'y'},
  {lbl:'动作分类完成', big:tagDone, hint:tagDone+' / '+N+' · 未分类 '+tagNone, v:pct(tagDone,N), tone:'r'},
  {lbl:'步骤 ≤3 步', big:thin, hint:'疑似转录不全，需人工复核', v:pct(thin,N), tone:'y'},

];
function AWK(){ return '步骤级 '+totImg+' / '+totSteps+' · '+pct(totImg,totSteps).toFixed(1)+'%'; }

document.getElementById('cards').innerHTML = cards.map(c =>
  '<div class="card"><div class="lbl">'+c.lbl+'</div><div class="big">'+c.big+'</div>'
  + '<div class="hint">'+c.hint+'</div><div class="bar"><i class="'+c.tone+'" style="width:'
  + Math.max(1,c.v).toFixed(1)+'%"></i></div></div>').join('');

/* ---------- 交叉矩阵 ---------- */
const srcs = Object.keys(srcCnt).sort((a,b)=>srcCnt[b]-srcCnt[a]);
let mh = '<table class="matrix"><thead><tr><th>来源</th><th class="num">菜谱</th>'
  + '<th class="num">有效视频</th><th class="num">步骤图全覆盖</th><th class="num">时长可信</th>'
  + '<th class="num">动作已分类</th><th>整体</th></tr></thead><tbody>';
srcs.forEach(s => {
  const sub = DATA.filter(d=>d.source===s);
  const n = sub.length;
  const v = sub.filter(d=>d.video_bucket.startsWith('A')).length;
  const i = sub.filter(d=>d.img_bucket.startsWith('A')).length;
  const t = sub.filter(d=>d.time_bucket.startsWith('A')).length;
  const g = sub.filter(d=>d.tag_bucket.startsWith('A')).length;
  const score = pct(v,n)+pct(i,n)+pct(t,n)+pct(g,n);
  const lvl = score>=300 ? pill('优秀','g') : score>=200 ? pill('良好','b') : score>=100 ? pill('待补','y') : pill('薄弱','r');
  mh += '<tr><td>'+s+'</td><td class="num">'+n+'</td><td class="num">'+v+' ('+pct(v,n).toFixed(0)+'%)</td>'
     +  '<td class="num">'+i+' ('+pct(i,n).toFixed(0)+'%)</td><td class="num">'+t+' ('+pct(t,n).toFixed(0)+'%)</td>'
     +  '<td class="num">'+g+' ('+pct(g,n).toFixed(0)+'%)</td><td>'+lvl+'</td></tr>';
});
mh += '</tbody></table>';
document.getElementById('matrix').innerHTML = mh;

/* ---------- 按菜系归类 ---------- */

  + '<th class="num">有效视频</th><th class="num">步骤图全覆盖</th>'
  + '<th class="num">时长可疑</th><th class="num">动作未分类</th></tr></thead><tbody>';
cKeys.forEach(k => {
  const sub = cMap[k], n = sub.length;
  const v = sub.filter(d=>d.video_bucket.startsWith('A')).length;
  const i = sub.filter(d=>d.img_bucket.startsWith('A')).length;
  const t = sub.filter(d=>d.time_flag).length;
  const g = sub.filter(d=>d.tag_bucket.startsWith('B')).length;
  ch += '<tr><td>'+k+'</td><td class="num">'+n+'</td>'
     +  '<td class="num">'+v+' ('+pct(v,n).toFixed(0)+'%)</td>'
     +  '<td class="num">'+i+' ('+pct(i,n).toFixed(0)+'%)</td>'
     +  '<td class="num'+(t?' warn':'')+'">'+t+'</td>'
     +  '<td class="num">'+g+' ('+pct(g,n).toFixed(0)+'%)</td></tr>';
});
ch += '</tbody></table>';
document.getElementById('cuisine').innerHTML = ch;

/* ---------- 筛选器 ---------- */
function uniq(key){ return [...new Set(DATA.map(d=>d[key]))].filter(x=>x!==null&&x!=='').sort(); }
function fill(id, key, label){
  const el = document.getElementById(id);
  uniq(key).forEach(v => { const o=document.createElement('option'); o.value=v; o.textContent=v; el.appendChild(o); });
}
fill('f-src','source'); fill('f-vid','video_bucket'); fill('f-img','img_bucket');
fill('f-time','time_bucket'); fill('f-tag','tag_bucket'); fill('f-cuisine','cuisine');

/* ---------- 渲染表 ---------- */
let view = DATA.slice();
function apply(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  const f = {
    source: document.getElementById('f-src').value,
    video_bucket: document.getElementById('f-vid').value,
    img_bucket: document.getElementById('f-img').value,
    time_bucket: document.getElementById('f-time').value,
    tag_bucket: document.getElementById('f-tag').value,
    cuisine: document.getElementById('f-cuisine').value,
  };
  view = DATA.filter(d => {
    if (q && !((d.title||'').toLowerCase().includes(q) || (d.title_zh||'').includes(q) || (d.slug||'').includes(q))) return false;
    for (const k in f) if (f[k] && d[k] !== f[k]) return false;
    return true;
  });
  render();
}
function render(){
  document.getElementById('cnt').textContent = '显示 ' + view.length + ' / ' + N;
  const html = view.map(d => {
    const imgTxt = d.steps ? (d.steps_with_img + '/' + d.steps) : '无步骤';
    const imgCls = d.img_bucket.charAt(0)==='A'?'g':d.img_bucket.charAt(0)==='D'?'r':d.img_bucket.charAt(0)==='B'?'b':'y';
    const vCls = d.video_bucket.charAt(0)==='A'?'g':d.video_bucket.charAt(0)==='B'?'k':'r';
    return '<tr>'
      + '<td>'+ (d.title_zh || d.title || '') +'<div class="mini">'+(d.title||'')+'</div></td>'
      + '<td class="mono">'+d.slug+'</td>'
      + '<td>'+d.source+'</td>'
      + '<td class="mono">'+(d.batch||'—')+'</td>'
      + '<td>'+(d.cuisine||'—')+'</td>'
      + '<td class="num'+(d.thin_steps?' warn':'')+'">'+d.steps+'</td>'
      + '<td>'+pill(imgTxt,imgCls)+'</td>'
      + '<td>'+pill(d.video_bucket,vCls)+'</td>'
      + '<td class="num'+(d.time_flag?' warn':'')+'">'+fmt(d.total_time_min)+(d.time_flag?' ↑':'')+'</td>'
      + '<td>'+pill(d.time_bucket, d.time_bucket.charAt(0)==='A'?'g':'y')+'</td>'
      + '<td>'+pill(d.tag_bucket.replace(/^[A-Z] /,''), d.tag_bucket.charAt(0)==='A'?'g':d.tag_bucket.charAt(0)==='B'?'r':'y')+'</td>'
      + '</tr>';
  }).join('');
  document.getElementById('tbody').innerHTML = html;
}
['q','f-src','f-vid','f-img','f-time','f-tag','f-cuisine'].forEach(id => {
  document.getElementById(id).addEventListener('input', apply);
  document.getElementById(id).addEventListener('change', apply);
});
document.getElementById('reset').onclick = () => {
  ['q','f-src','f-vid','f-img','f-time','f-tag','f-cuisine'].forEach(id => {
    const el = document.getElementById(id); el.value = '';
  });
  apply();
};
document.getElementById('csv').onclick = () => {
  const cols = ['slug','title','title_zh','source','batch','cuisine','meal_role','difficulty',
                'steps','steps_with_img','img_bucket','video_bucket','total_time_min',
                'time_bucket','tag_bucket','video_url'];
  const esc = v => '"' + String(v===null||v===undefined?'':v).replace(/"/g,'""') + '"';
  const lines = [cols.join(',')].concat(view.map(d => cols.map(c=>esc(d[c])).join(',')));
  const blob = new Blob(['\ufeff'+lines.join('\r\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'wokmaster_inventory_' + view.length + '.csv';
  a.click();
};
apply();
</script>
</body>
</html>
